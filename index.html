<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Labs — Dice Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.10.0/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b2e 0%, #2d2a45 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(45, 42, 69, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
        }

        .network-config {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .network-config input {
            width: 100%;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .wallet-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .wallet-button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
        }

        .wallet-button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .wallet-info {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .wallet-info.connected {
            display: block;
        }

        .wallet-info p {
            margin: 8px 0;
            word-break: break-all;
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 700;
            color: #00d4ff;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
        }

        .roll-button {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff006e, #ff4d7d);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .roll-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 0, 110, 0.3);
        }

        .roll-button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box.win {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .result-box.lose {
            border-color: #ff006e;
            background: rgba(255, 0, 110, 0.05);
        }

        .result-title {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-box.win .result-title {
            color: #00ff88;
        }

        .result-box.lose .result-title {
            color: #ff006e;
        }

        .result-details {
            font-size: 0.95em;
            color: #aaa;
            margin-bottom: 10px;
        }

        .result-payout {
            font-size: 1.3em;
            color: #00d4ff;
            margin-top: 10px;
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item.win {
            color: #00ff88;
        }

        .history-item.lose {
            color: #ff006e;
        }

        .error-message {
            background: rgba(255, 0, 110, 0.1);
            border: 1px solid #ff006e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            color: #ff9db5;
            font-size: 0.9em;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            color: #00ff88;
            font-size: 0.9em;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 Prism Labs</h1>
            <p class="subtitle">Decentralized Dice Game</p>
        </header>

        <div class="network-config">
            <label>RPC Endpoint</label>
            <input type="text" id="rpcUrl" placeholder="https://mainnet.base.org" value="https://mainnet.base.org">
            <label>Contract Address</label>
            <input type="text" id="contractAddress" placeholder="0xAf02f9A0eD05544ea988dE99Fd830a08e126Da02" value="0xAf02f9A0eD05544ea988dE99Fd830a08e126Da02">
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="wallet-section">
            <button class="wallet-button" id="connectWallet">Connect Wallet</button>
            <div class="wallet-info" id="walletInfo">
                <p><strong>Address:</strong> <span id="walletAddress"></span></p>
                <p><strong>Balance:</strong> <span id="walletBalance"></span> ETH</p>
            </div>
        </div>

        <div class="game-section" id="gameSection">
            <div class="stats-box">
                <div class="stat">
                    <div class="stat-label">Total Games</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total Volume</div>
                    <div class="stat-value" id="totalVolume">0 ETH</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total Wins</div>
                    <div class="stat-value" id="totalWins">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
            </div>

            <div class="input-group">
                <label for="stakeAmount">Stake Amount (ETH)</label>
                <input type="number" id="stakeAmount" placeholder="0.01" min="0.001" step="0.001" value="0.01">
            </div>

            <button class="roll-button" id="rollButton">Roll Dice</button>

            <div class="result-box" id="resultBox">
                <div class="result-title" id="resultTitle">--</div>
                <div class="result-details" id="resultDetails"></div>
                <div class="result-payout" id="resultPayout"></div>
            </div>

            <div>
                <label style="margin-bottom: 10px;">Recent Games</label>
                <div class="history" id="history">
                    <p style="color: #888; text-align: center;">No games yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONTRACT_ABI = [
            'function roll() public payable returns (uint256)',
            'function getStats() public view returns (uint256, uint256, uint256, uint256, uint256)',
            'function getGame(uint256 gameId) public view returns (address, uint256, uint256, bool, bool)',
            'event GameResolved(uint256 indexed gameId, address indexed player, bool won, uint256 payout)'
        ];

        let provider, signer, contract, userAddress;
        const gameHistory = [];
        const ethers = window.ethers;

        if (!ethers) {
            console.error('ethers.js failed to load');
            document.body.innerHTML = '<div style="color: red; padding: 20px;">Error: ethers.js library failed to load. Please refresh the page.</div>';
        }

        async function getConfig() {
            return {
                rpc: document.getElementById('rpcUrl').value || 'http://localhost:8545',
                contract: document.getElementById('contractAddress').value
            };
        }

        async function initProvider() {
            console.log('Using MetaMask provider');
        }

        async function connectWallet() {
            try {
                showError('');
                if (typeof window.ethereum === 'undefined') {
                    showError('MetaMask not detected. Please install MetaMask.');
                    return;
                }

                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                console.log('Connected account:', userAddress);

                // Use MetaMask's provider instead of custom RPC
                const ethersProvider = new ethers.BrowserProvider(window.ethereum);
                signer = await ethersProvider.getSigner();
                const config = await getConfig();
                contract = new ethers.Contract(config.contract, CONTRACT_ABI, signer);

                await updateWalletInfo();
                await updateStats();
                document.getElementById('gameSection').classList.add('active');
                showSuccess('Wallet connected successfully!');
            } catch (error) {
                console.error('Connection error:', error);
                showError('Failed to connect wallet: ' + error.message);
            }
        }

        async function updateWalletInfo() {
            document.getElementById('walletAddress').textContent = userAddress;
            const ethersProvider = new ethers.BrowserProvider(window.ethereum);
            const balance = await ethersProvider.getBalance(userAddress);
            document.getElementById('walletBalance').textContent = ethers.formatEther(balance);
            document.getElementById('walletInfo').classList.add('connected');
        }

        async function updateStats() {
            try {
                if (!contract) {
                    console.log('Contract not initialized yet');
                    return;
                }
                // Use read-only provider for stats (doesn't need signer)
                const readProvider = new ethers.JsonRpcProvider('https://mainnet.base.org');
                const readContract = new ethers.Contract(contract.target, CONTRACT_ABI, readProvider);
                const stats = await readContract.getStats();
                document.getElementById('totalGames').textContent = stats[0].toString();
                document.getElementById('totalVolume').textContent = ethers.formatEther(stats[1]);
                document.getElementById('totalWins').textContent = stats[2].toString();
                document.getElementById('winRate').textContent = stats[3].toString() + '%';
            } catch (error) {
                console.error('Failed to fetch stats:', error);
                showError('Failed to load stats: ' + error.message);
            }
        }

        async function rollDice() {
            try {
                showError('');
                const stakeAmount = document.getElementById('stakeAmount').value;
                if (!stakeAmount || parseFloat(stakeAmount) <= 0) {
                    showError('Please enter a valid stake amount');
                    return;
                }

                const stakeWei = ethers.parseEther(stakeAmount);
                document.getElementById('rollButton').disabled = true;
                document.getElementById('rollButton').innerHTML = '<span class="loading"></span> Rolling...';

                const tx = await contract.roll({ value: stakeWei });
                console.log('Transaction sent:', tx.hash);
                const receipt = await tx.wait();
                console.log('Transaction confirmed');

                // Parse events from receipt
                let gameData = {
                    stake: stakeAmount,
                    won: false,
                    payout: '0'
                };

                if (receipt && receipt.logs) {
                    for (const log of receipt.logs) {
                        try {
                            const parsed = contract.interface.parseLog(log);
                            if (parsed && parsed.name === 'GameResolved') {
                                gameData.won = parsed.args[2];
                                gameData.payout = ethers.formatEther(parsed.args[3]);
                            }
                        } catch (e) {
                            // Skip unparseable logs
                        }
                    }
                }

                gameHistory.unshift(gameData);
                displayResult(gameData);
                await updateStats();
                updateHistory();
                showSuccess('Game resolved!');

            } catch (error) {
                console.error('Roll error:', error);
                showError('Roll failed: ' + error.message);
            } finally {
                document.getElementById('rollButton').disabled = false;
                document.getElementById('rollButton').innerHTML = 'Roll Dice';
            }
        }

        function displayResult(gameData) {
            const resultBox = document.getElementById('resultBox');
            const resultTitle = document.getElementById('resultTitle');
            const resultDetails = document.getElementById('resultDetails');
            const resultPayout = document.getElementById('resultPayout');

            resultBox.classList.remove('win', 'lose');
            if (gameData.won) {
                resultBox.classList.add('win');
                resultTitle.textContent = '🎉 YOU WON!';
                resultDetails.textContent = `You staked ${gameData.stake} ETH`;
                resultPayout.textContent = `Payout: ${gameData.payout} ETH`;
            } else {
                resultBox.classList.add('lose');
                resultTitle.textContent = '😢 YOU LOST';
                resultDetails.textContent = `Better luck next time!`;
                resultPayout.textContent = `Stake: ${gameData.stake} ETH`;
            }

            resultBox.classList.add('show');
        }

        function updateHistory() {
            const historyDiv = document.getElementById('history');
            if (gameHistory.length === 0) {
                historyDiv.innerHTML = '<p style="color: #888; text-align: center;">No games yet</p>';
                return;
            }

            historyDiv.innerHTML = gameHistory.map((game, index) => `
                <div class="history-item ${game.won ? 'win' : 'lose'}">
                    <span>Game #${index} - ${game.stake} ETH</span>
                    <span>${game.won ? '✓ Won ' + game.payout + ' ETH' : '✗ Lost'}</span>
                </div>
            `).join('');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (message) {
                errorDiv.textContent = message;
                errorDiv.classList.add('show');
            } else {
                errorDiv.classList.remove('show');
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => successDiv.classList.remove('show'), 3000);
        }

        // Event listeners
        document.getElementById('connectWallet').addEventListener('click', connectWallet);
        document.getElementById('rollButton').addEventListener('click', rollDice);

        // Initialize
        window.addEventListener('load', async () => {
            console.log('Page loaded, initializing provider...');
            await initProvider();
            console.log('Provider ready');
        });
    </script>
</body>
</html>
